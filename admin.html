<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin – TraceChain</title><link rel="stylesheet" href="css/style.css"></head><body>
<nav class="nav"><a class="logo" href="index.html"><i>📦</i><span>TraceChain</span></a><div class="links"><a href="index.html" class="">Home</a><a href="track.html" class="">Track</a><a href="participant.html" class="">Participant</a><a href="admin.html" class="on">Admin</a></div><button class="btn" id="wbtn">Connect wallet</button></nav>
<main class="wrap"><h1>Network admin</h1><p class="sub">Approve or remove supply-chain participants.</p><div id="gate"><div class="notice">Connect your wallet to continue.</div></div>
<div id="adm" style="display:none"><div class="panel"><h2>Register a participant</h2><div class="row" style="grid-template-columns:1fr 1fr 150px auto"><div><label>Wallet</label><input id="wa" placeholder="0x…"></div><div><label>Name</label><input id="wn" placeholder="e.g. Cocoa Farms Ltd"></div><div><label>Role</label><select id="wr"><option>Producer</option><option>Transporter</option><option>Warehouse</option><option>Distributor</option><option>Retailer</option><option>Inspector</option></select></div><button class="btn" id="addp">Register</button></div></div>
<div class="panel"><h2>Participants</h2><div style="overflow-x:auto"><table><thead><tr><th>Name</th><th>Role</th><th>Wallet</th><th>Status</th><th></th></tr></thead><tbody id="pl"></tbody></table></div></div></div></main>
<footer>© 2026 TraceChain · Built on BOT Chain<br><a href="https://botchain.ai" target="_blank" rel="noopener">BOT Chain Website</a> · <a href="https://scan.bohr.life" target="_blank" rel="noopener">BOT Chain Explorer</a></footer><div id="toast"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script><script src="js/app.js"></script>
<script>
document.addEventListener("ready",async()=>{
  if((await vault.admin()).toLowerCase()!==account.toLowerCase()){$("#gate").innerHTML='<div class="notice">Only the contract admin can use this page.</div>';return}
  $("#gate").innerHTML="";$("#adm").style.display="block";list();
});
async function list(){
  const n=Number(await vault.participantCount());let h="";
  for(let i=0;i<n;i++){const [a,name,role,on]=await vault.participantAt(i);
    h+=`<tr><td><b>${esc(name)}</b></td><td>${esc(role)}</td><td class="mono">${a}</td><td>${on?'<span class="badge ok">Active</span>':'<span class="badge off">Removed</span>'}</td><td>${on?`<button class="btn sm danger" data-r="${a}">Remove</button>`:""}</td></tr>`}
  $("#pl").innerHTML=h||'<tr><td colspan="5" class="empty">No participants registered yet.</td></tr>';
  document.querySelectorAll("[data-r]").forEach(b=>b.onclick=async()=>{if(await tx(vault.removeParticipant(b.dataset.r),"Participant removed"))list()});
}
$("#addp").onclick=async()=>{
  const a=$("#wa").value.trim(),n=$("#wn").value.trim();
  if(!ethers.isAddress(a)||!n)return toast("Enter a valid address and a name",1);
  if(await tx(vault.addParticipant(a,n,$("#wr").value),"Participant registered")){$("#wa").value="";$("#wn").value="";list()}
};
</script></body></html>
